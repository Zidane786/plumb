version: 2
updates:
  # Plumb ships with no Python dependencies (standard library only); this keeps the
  # GitHub Actions used by CI (actions/checkout, actions/setup-python) up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # the Playwright the browser tests pin (tests/requirements.txt): each new version is its own pull request, so CI runs
  # the whole suite on every OS with it before anyone's machine moves to it
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: monthly
